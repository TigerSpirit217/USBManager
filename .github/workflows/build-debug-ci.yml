name: Build Debug CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest commit of default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set CI version name
        id: version
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          echo "name=test-${commit:0:6}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        env:
          CI_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: bash ./gradlew :app:assembleDebug -PciVersionName="$CI_VERSION_NAME" --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: USBManager-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
