name: Build KernelSU module

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build module package
        run: |
          chmod +x gradlew
          python3 kernelsu/package_module.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: USBManager-KernelSU
          path: kernelsu/USBManager-KernelSU-*.zip
          if-no-files-found: error

      - name: Attach package to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" kernelsu/USBManager-KernelSU-*.zip --clobber
