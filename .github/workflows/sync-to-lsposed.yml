name: Sync to LSPosed Repo

on:
  # README / LICENSE 变更时触发
  push:
    branches: [master]
    paths:
      - "README_ENG.md"
      - "README.md"
      - "LICENSE"

  # 手动发布或编辑 Release 时触发
  release:
    types: [published, edited]

  # 手动触发（补漏 / 全量同步）
  workflow_dispatch:
    inputs:
      action:
        description: "同步内容"
        required: true
        type: choice
        options:
          - all
          - readme
          - release
      tag:
        description: "指定 Release tag（留空=最新）"
        required: false
        default: ""

env:
  LSPOSED_REPO: "Xposed-Modules-Repo/com.tiger.usbmanager"
  PAT: ${{ secrets.LSPOSED_SYNC_TOKEN }}

jobs:
  # ═══════════════════════════════════════
  #  Job 1: 同步 README + LICENSE
  # ═══════════════════════════════════════
  sync-docs:
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'all' || github.event.inputs.action == 'readme') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync files via Contents API
        run: |
          for FILE in README.md LICENSE README_ENG.md; do
            [ ! -f "$FILE" ] && echo "⚠️ $FILE 不存在，跳过" && continue

            CONTENT_B64=$(base64 -w 0 "$FILE")

            # 获取目标仓库当前文件的 SHA（用于更新）
            EXISTING=$(curl -sf \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$LSPOSED_REPO/contents/$FILE" 2>/dev/null || echo "")

            SHA=$(echo "$EXISTING" | jq -r '.sha // empty')

            # 比较内容是否相同
            if [ -n "$SHA" ]; then
              REMOTE_B64=$(echo "$EXISTING" | jq -r '.content' | tr -d '\n')
              if [ "$CONTENT_B64" = "$REMOTE_B64" ]; then
                echo "✅ $FILE 无变化，跳过"
                continue
              fi
            fi

            # 构建请求体
            BODY=$(jq -n \
              --arg msg "docs: sync $FILE from source ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
              --arg content "$CONTENT_B64" \
              --arg sha "$SHA" \
              '{message: $msg, content: $content} + (if $sha != "" then {sha: $sha} else {} end)')

            HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$LSPOSED_REPO/contents/$FILE" \
              -d "$BODY")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "✅ $FILE 已同步 (HTTP $HTTP_CODE)"
            else
              echo "❌ $FILE 同步失败 (HTTP $HTTP_CODE)"
              cat /tmp/resp.json | jq .
              exit 1
            fi
          done

  # ═══════════════════════════════════════
  #  Job 2: 同步 Release + APK
  # ═══════════════════════════════════════
  sync-release:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'all' || github.event.inputs.action == 'release'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release info
        id: resolve
        run: |
          SRC_REPO="${{ github.repository }}"

          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.event.release.tag_name }}"

          if [ -z "$TAG" ]; then
            API="https://api.github.com/repos/$SRC_REPO/releases/latest"
          else
            API="https://api.github.com/repos/$SRC_REPO/releases/tags/$TAG"
          fi

          RESP=$(curl -sf "$API") || { echo "::error::获取源 Release 失败"; exit 1; }

          TAG_NAME=$(echo "$RESP" | jq -r '.tag_name')
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$RESP" | jq -r '.name // empty')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$RESP" | jq -r '.prerelease')" >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF_BODY"
            echo "$RESP" | jq -r '.body // ""'
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

          # 提取 assets 信息（包含 digest 和 download_url）
          echo "$RESP" | jq -r \
            '.assets[] | select(.name | test("\\.(apk|zip)$")) | "\(.name)|\(.browser_download_url)|\(.digest // empty)"' \
            > assets_list.txt

          echo "📦 源 Release: $TAG_NAME"
          cat assets_list.txt

      - name: Find target release
        id: target
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"

          # 先查 tags 端点（已发布 Release）
          RESP=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$LSPOSED_REPO/releases/tags/$TAG")

          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          # 如果 tags 端点查不到，再查所有 Release（包含 draft）
          if [ "$HTTP_CODE" != "200" ]; then
            BODY=$(curl -sf \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$LSPOSED_REPO/releases?per_page=100" \
              | jq -c --arg tag "$TAG" '.[] | select(.tag_name == $tag)')
          fi

          if [ -n "$BODY" ] && [ "$BODY" != "null" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release_id=$(echo "$BODY" | jq -r '.id')" >> "$GITHUB_OUTPUT"
            echo "upload_url=$(echo "$BODY" | jq -r '.upload_url' | sed 's/{?name,label}//')" >> "$GITHUB_OUTPUT"
            # 提取目标仓库已有 assets 的名称和 digest
            echo "$BODY" | jq -r '.assets[] | "\(.name)|\(.id)|\(.digest // empty)"' > target_assets.txt
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            : > target_assets.txt
          fi

      - name: Compare and download assets
        id: compare
        run: |
          mkdir -p artifacts
          NEED_UPLOAD=false

          while IFS='|' read -r name url src_digest; do
            [ -z "$name" ] && continue

            # 查找目标仓库中同名 asset 的 digest
            TARGET_LINE=$(grep "^${name}|" target_assets.txt || true)
            TARGET_DIGEST=""
            if [ -n "$TARGET_LINE" ]; then
              TARGET_DIGEST=$(echo "$TARGET_LINE" | cut -d'|' -f3)
            fi

            echo "🔍 $name"
            echo "   源 digest:  ${src_digest:-（无）}"
            echo "   目标 digest: ${TARGET_DIGEST:-（无）}"

            # 比较 digest
            if [ -n "$src_digest" ] && [ "$src_digest" = "$TARGET_DIGEST" ]; then
              echo "   ✅ digest 一致，跳过下载和上传"
              continue
            fi

            # digest 不一致或缺失，需要下载
            echo "   ⬇️  下载 $name ..."
            curl -fSL --retry 3 -o "artifacts/$name" "$url"
            NEED_UPLOAD=true
          done < assets_list.txt

          echo "need_upload=$NEED_UPLOAD" >> "$GITHUB_OUTPUT"

      - name: Update or create release
        if: steps.compare.outputs.need_upload == 'true' || steps.target.outputs.exists == 'false'
        id: upsert
        env:
          BODY: ${{ steps.resolve.outputs.body }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          NAME="${{ steps.resolve.outputs.name }}"
          PRE="${{ steps.resolve.outputs.prerelease }}"

          # 用文件保存 body，避免多行转义问题
          printf '%s' "$BODY" > body.txt

          if [ "${{ steps.target.outputs.exists }}" = "true" ]; then
            RELEASE_ID="${{ steps.target.outputs.release_id }}"
            echo "更新已有 Release ID: $RELEASE_ID"

            # 先更新 body/name/prerelease，保持 draft 状态不变（避免已知的 race condition）
            PAYLOAD=$(jq -n \
              --arg name "$NAME" \
              --rawfile body body.txt \
              --argjson pre "$PRE" \
              '{name: $name, body: $body, prerelease: $pre}')

            curl -sf -X PATCH \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$LSPOSED_REPO/releases/$RELEASE_ID" \
              -d "$PAYLOAD" > /dev/null

            # 如果原来是 draft，再单独发一次 PATCH 将其发布
            # 参考：https://github.com/orgs/community/discussions/191148
            CURRENT_DRAFT=$(curl -sf \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$LSPOSED_REPO/releases/$RELEASE_ID" \
              | jq -r '.draft')

            if [ "$CURRENT_DRAFT" = "true" ]; then
              echo "📤 将 draft 转为 published ..."
              curl -sf -X PATCH \
                -H "Authorization: Bearer $PAT" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$LSPOSED_REPO/releases/$RELEASE_ID" \
                -d '{"draft": false}' > /dev/null
            fi

            UPLOAD_URL="${{ steps.target.outputs.upload_url }}"

            # 删除需要替换的旧 asset
            while IFS='|' read -r name url src_digest; do
              [ -z "$name" ] && continue

              # 如果本地没有下载这个文件，说明 digest 一致，保留旧 asset
              [ ! -f "artifacts/$name" ] && continue

              # 查找目标 asset ID
              TARGET_LINE=$(grep "^${name}|" target_assets.txt || true)
              if [ -n "$TARGET_LINE" ]; then
                ASSET_ID=$(echo "$TARGET_LINE" | cut -d'|' -f2)
                echo "🗑️ 删除旧 asset: $name (ID: $ASSET_ID)"
                curl -sf -X DELETE \
                  -H "Authorization: Bearer $PAT" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$LSPOSED_REPO/releases/assets/$ASSET_ID"
              fi
            done < assets_list.txt

          else
            echo "创建新 Release"

            PAYLOAD=$(jq -n \
              --arg tag "$TAG" \
              --arg name "$NAME" \
              --rawfile body body.txt \
              --argjson pre "$PRE" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $pre}')

            RESP=$(curl -sf -X POST \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$LSPOSED_REPO/releases" \
              -d "$PAYLOAD")

            UPLOAD_URL=$(echo "$RESP" | jq -r '.upload_url' | sed 's/{?name,label}//')
            echo "✅ Release 已创建"
          fi

          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload assets
        if: steps.compare.outputs.need_upload == 'true' || steps.target.outputs.exists == 'false'
        run: |
          UPLOAD_URL="${{ steps.upsert.outputs.upload_url }}"

          for FILE in artifacts/*; do
            [ ! -f "$FILE" ] && continue
            FNAME=$(basename "$FILE")
            echo "⬆️  上传 $FNAME ..."

            HTTP_CODE=$(curl -s -o /tmp/upload_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $PAT" \
              -H "Content-Type: application/octet-stream" \
              "$UPLOAD_URL?name=$FNAME" \
              --data-binary "@$FILE")

            if [ "$HTTP_CODE" = "201" ]; then
              echo "   ✅ $FNAME 上传成功"
            else
              echo "   ❌ $FNAME 上传失败 (HTTP $HTTP_CODE)"
              cat /tmp/upload_resp.json | jq .
              exit 1
            fi
          done

          echo ""
          echo "🎉 同步完成！"
          echo "   https://github.com/$LSPOSED_REPO/releases/tag/${{ steps.resolve.outputs.tag }}"